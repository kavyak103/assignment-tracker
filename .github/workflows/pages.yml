name: Publish tracker and refresh Canvas

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tracker
        uses: actions/checkout@v6

      - name: Refresh encrypted Canvas snapshot
        if: github.event_name != 'push'
        env:
          CANVAS_FEED_URL: ${{ secrets.CANVAS_FEED_URL }}
          CANVAS_SYNC_PASSPHRASE: ${{ secrets.CANVAS_SYNC_PASSPHRASE }}
        run: node scripts/encrypt-canvas-feed.mjs

      - name: Save updated encrypted snapshot
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- canvas-sync.enc.json; then
            echo "Canvas snapshot is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add canvas-sync.enc.json
            git commit -m "Refresh encrypted Canvas snapshot"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
